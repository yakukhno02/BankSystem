spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;TIME ZONE=Europe/Kyiv
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

security:
  jwt:
    secret-key: test-secret-key-for-unit-tests-only-not-for-production-use
    expiration-ms: 3600000
